# Publica o jogo no GitHub Pages a cada envio para a branch main.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # versão para o CrazyGames: gera o zip e deixa para baixar em /baixar/cosmic-citadel-crazygames.zip
      - run: npm run build:crazy
      - run: mkdir -p dist/baixar && cd dist-crazygames && zip -qr ../dist/baixar/cosmic-citadel-crazygames.zip .
      # app Android de teste (APK): fica para baixar em /baixar/cosmic-citadel.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run build:android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/baixar/cosmic-citadel.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
