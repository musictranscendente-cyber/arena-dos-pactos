<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena dos Pactos (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&family=Alegreya+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#c7ced8; --text:#1d2230;
  --slate:#263041; --cell:#303c54; --cellf:#38465f; --line:#4a5a7c;
  --bone:#efe6d2; --foe:#ead6cf; --ink:#2b2320;
  --gold:#e0aa45; --mana:#3b7fd1; --blood:#c0413b;
  --sag:#cf5a2e; --esc:#7a3fa6; --aqu:#2e9cc8; --tou:#6f8f2e;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0f131b;--text:#e6e9f0;}}
:root[data-theme="dark"]{--page:#0f131b;--text:#e6e9f0;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--text);font-family:'Alegreya Sans','Trebuchet MS',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:900px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:12px;background:var(--slate);color:#eef1f6}
.who{display:flex;align-items:center;gap:8px}
.av{font-size:26px}
.nm{font-weight:800;font-size:15px}
.sub{font-size:12px;color:#aab4c8}
.stats{display:flex;align-items:center;gap:10px}
.hp{position:relative;font-weight:800;font-size:20px;color:#ffb3ab}
.mana{font-weight:700;font-size:15px;color:#a9cbff}
.table{background:var(--slate);border-radius:14px;padding:7px;display:flex;flex-direction:column;gap:6px}
.board{display:flex;flex-direction:column;gap:5px}
.lane{display:grid;grid-template-columns:repeat(3,1fr) 8px repeat(3,1fr);gap:4px;align-items:stretch}
.divider{border-radius:4px;background:repeating-linear-gradient(180deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.55}
.heroes{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side{display:flex;align-items:center;gap:8px}
.cell{position:relative;height:74px;border-radius:9px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.cell.front{background:var(--cellf)}
.cell.ok{background:#45506a;box-shadow:inset 0 0 0 2px var(--gold)}
.unit{position:absolute;inset:3px;border-radius:7px;background:var(--bone);color:var(--ink);border-left:5px solid var(--rc);display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.unit.foe{background:var(--foe);border-left:0;border-right:5px solid var(--rc)}
.cell.atk .unit{transform:scale(1.08);box-shadow:0 0 0 2px var(--gold),0 0 14px var(--gold);z-index:2}
.unit .emo{font-size:26px;line-height:1;margin-top:-10px}
.unit.foe .emo{transform:scaleX(-1)}
.unit .a,.unit .h{position:absolute;bottom:2px;font-weight:800;font-size:14px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;display:grid;place-items:center;color:#fff}
.unit .a{left:2px;background:#8a5a12}
.unit .h{right:2px;background:var(--blood)}
.kws{position:absolute;top:1px;left:3px;font-size:11px}
.shd{position:absolute;top:1px;right:3px;font-size:12px}
.pnd{position:absolute;top:14px;right:3px;font-size:10px}
.spell-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;z-index:3;pointer-events:none;filter:drop-shadow(0 0 4px #fff)}
.mid{min-height:36px;margin-top:2px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.25;color:#dfe5ef;padding:3px 6px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.me{flex-wrap:wrap}
.orbs{display:flex;gap:3px;flex-wrap:wrap;max-width:130px}
.orb{width:12px;height:12px;border-radius:50%;background:#1d2533;box-shadow:inset 0 0 0 1px var(--line)}
.orb.on{background:var(--mana);box-shadow:none}
.orb.spent{background:#22324a;box-shadow:inset 0 0 0 1px var(--mana)}
.orb.bonus{background:#8ec0ff;box-shadow:none}
.mtxt{font-size:13px;color:#a9cbff;font-weight:700}
.acts{display:flex;gap:6px}
.btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--gold);color:#2a1d05}
.btn.rc{background:#3b4a66;color:#fff}
.btn:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hand{display:flex;gap:7px;overflow-x:auto;padding:10px 4px 10px}
.card{flex:0 0 88px;height:126px;border-radius:10px;background:var(--bone);color:var(--ink);position:relative;padding:18px 5px 5px;border-top:6px solid var(--rc);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .12s}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold)}
.card{border-bottom:4px solid var(--rr)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gtop .btn{width:auto}
.gtabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.gtab{font:inherit;font-size:20px;width:38px;height:38px;border-radius:9px;border:0;background:#1d2533;color:var(--rc);cursor:pointer}
.gtab.on{box-shadow:inset 0 0 0 2px var(--rc);background:#2a3447}
.ginfo{min-height:38px;font-size:14px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 8px;padding-top:8px}
.ggrid .card{flex:none;width:auto}
.card.poor{opacity:.5}
.cost{position:absolute;top:-8px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--mana);color:#fff;font-weight:800;display:grid;place-items:center;border:2px solid var(--bone)}
.card .emo{font-size:28px;line-height:1.1}
.card .sg{position:absolute;top:2px;right:5px;font-size:14px;color:var(--rc);font-weight:800}
.card .cn{font-size:11.5px;font-weight:700;text-align:center;line-height:1.1}
.card .ck{font-size:11px}
.card .st{margin-top:auto;display:flex;justify-content:space-between;width:100%;font-weight:800;font-size:13px}
.card .st .x{color:#8a5a12}.card .st .y{color:var(--blood)}
.card .sp{margin-top:auto;font-size:10.5px;text-align:center;line-height:1.15}
.empty{font-size:13px;color:var(--text);opacity:.7;padding:20px 4px}
.fx{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-weight:800;font-size:19px;color:#fff;text-shadow:0 1px 0 #000,0 0 6px #000;pointer-events:none;animation:rise .95s ease-out forwards;z-index:5;white-space:nowrap}
.fx.heal{color:#8fe388}.fx.dmg{color:#ff8a7a}.fx.sh{color:#9fd3ff}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
.ov{position:fixed;inset:0;background:rgba(10,13,20,.88);display:grid;place-items:center;padding:20px;z-index:20;overflow:auto}
.panel{max-width:380px;width:100%;background:var(--slate);color:#eef1f6;border-radius:16px;padding:20px 20px 22px;box-shadow:0 0 0 2px #3a4762}
.panel h1{font-family:'Grenze Gotisch',Georgia,serif;font-size:44px;line-height:1;margin:0 0 4px;color:var(--gold);letter-spacing:.5px}
.panel h2{font-family:'Grenze Gotisch',Georgia,serif;font-size:38px;margin:0 0 8px;color:var(--gold)}
.panel p{margin:6px 0;line-height:1.4;font-size:15px}
.panel ul{padding-left:18px;margin:8px 0 12px;line-height:1.4;font-size:14.5px}
.panel li{margin:4px 0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:13.5px;margin:6px 0 16px;color:#d5dbe7}
.panel .btn{width:100%}
.panel.wide{max-width:680px}
.acts2{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 12px}
.land .signs{grid-template-columns:repeat(6,1fr)}
.sign{position:relative;font:inherit;border:0;border-radius:10px;background:#1d2533;color:#eef1f6;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;box-shadow:inset 0 -3px 0 var(--rc)}
.sign:focus-visible{outline:3px solid #fff}
.sign .g{font-size:26px;color:var(--rc);line-height:1.1}
.sign .sn{font-weight:800;font-size:14px}
.sign .sm{font-size:11px;color:#aab4c8;text-align:center;line-height:1.1}
.sign .tag{position:absolute;top:-6px;right:-2px;background:var(--gold);color:#2a1d05;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
details{margin-top:4px}
summary{cursor:pointer;font-weight:800;color:var(--gold);padding:6px 0}
.land .panel{padding:12px 16px}
.land .panel h1{font-size:32px}
.land .panel p{font-size:13.5px;margin:4px 0}
@media (orientation:landscape) and (max-height:520px){
  .cell{height:62px}
  .card{flex-basis:84px;height:100px;padding-top:14px}
  .card .emo{font-size:22px}
  .hand{padding:8px 4px 4px}
  .hero{padding:4px 10px}
}
@media (max-width:420px){
  .unit .emo{font-size:22px}
  .unit .a,.unit .h{font-size:12.5px;min-width:18px;height:18px;padding:0 3px}
}
/* modo deitado */
body.rot{overflow:hidden}
body.rot #app{position:fixed;top:0;left:0;max-width:none;margin:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%);overflow:hidden;background:var(--page)}
.bottom{display:flex;flex-direction:column;gap:6px}
.land #app{gap:4px;padding:6px 8px}
.land .hero{padding:3px 10px}
.land .av{font-size:19px}.land .nm{font-size:13px}.land .sub{font-size:11px}.land .hp{font-size:17px}
.land .table{padding:5px;gap:4px}
.land .board{gap:4px}
.land .cell{height:54px}
.land .unit .emo{font-size:22px;margin-top:-8px}
.land .unit .a,.land .unit .h{font-size:12.5px;min-width:18px;height:18px}
.land .mid{min-height:24px;font-size:13px;padding:1px 6px}
.land .bottom{flex-direction:row;align-items:stretch;gap:8px}
.land .bottom .hand{flex:1;padding:9px 2px 2px;gap:5px}
.land .card{flex:0 1 80px;min-width:60px;height:94px;padding:12px 4px 4px}
.land .card .emo{font-size:20px}.land .card .cn{font-size:10.5px}.land .card .sp{font-size:9.5px}.land .card .st{font-size:12px}
.land .cost{width:22px;height:22px;font-size:13px}
.land .me{order:2;flex:0 0 150px;flex-direction:column;justify-content:center;gap:5px;padding:5px 8px}
.land .acts{flex-direction:column;width:100%;gap:5px}
.land .btn{min-height:36px;padding:5px 8px;font-size:14px}
.rotbtn{font:inherit;background:#3b4a66;color:#fff;border:0;border-radius:8px;padding:4px 8px;font-size:15px;cursor:pointer}
@media (prefers-reduced-motion:reduce){
  .fx{animation:fade .9s forwards}
  @keyframes fade{to{opacity:0}}
  .card.sel,.cell.atk .unit{transform:none}
}

function shuffle(d){ for (let i = d.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }

function costOf(side, c){
  if (c.type !== 'spell') return c.cost;
  const b = S[side].board;
  for (let l = 0; l < 3; l++) for (let d = 0; d < 3; d++){ const u = b[l][d]; if (u && u.kw.includes('corrente')) return Math.max(0, c.cost - 1); }
  return c.cost;
}
function cardText(c){
  if (c.type === 'spell') return c.text;
  const parts = c.kw.map(k => KW[k].n + ': ' + KW[k].d);
  if (c.on) parts.push(ON[c.on]);
  return parts.length ? parts.join(' ') : 'Sem habilidade especial.';
}
function fxCell(side,l,d,text,cls){ S.fx.push({id:`c-${side}-${l}-${d}`, text, cls}); }

  S.fx.forEach(f => {

    const s = document.createElement('span'); s.className = 'fx ' + (f.cls || ''); s.textContent = f.text;
    el.appendChild(s); setTimeout(() => s.remove(), 1000);

}

function newGame(sign){
  const foes = ORDER.filter(k => k !== sign);
  const foe = foes[Math.floor(Math.random() * foes.length)];
  S = {screen:'play', turnNo:0, turn:'p', sel:null, busy:false, over:false, msg:'', fx:[], active:null, result:null, p:mkPlayer(sign), e:mkPlayer(foe)};
  S.aiQueue = []; S.pQueue = [];
  for (let i = 0; i < 3; i++){ draw('p'); draw('e'); }

}
function draw(side){
  const P = S[side];
  if (!P.deck.length){ P.hp -= 2; fxHero(side, '-2', 'dmg'); if (side === 'p') S.msg = 'Seu deck acabou: -2 de vida.'; return; }
  const cid = P.deck.pop();
  if (P.hand.length >= HAND_MAX){ if (side === 'p') S.msg = 'Mão cheia: a carta comprada foi descartada.'; return; }
  P.hand.push({hid:++UID, cid});
}
function checkOver(){
  if (S.over) return true;
  if (S.p.hp <= 0 || S.e.hp <= 0){
    S.over = true; S.busy = false; S.screen = 'end';
    S.result = (S.p.hp <= 0 && S.e.hp <= 0) ? 'draw' : (S.e.hp <= 0 ? 'win' : 'lose');
    return true;
  }
  return false;
}
function tickSide(side){
  const P = S[side];
  P.max = Math.min(MAX_MANA, P.max + 1); P.mana = P.max; P.recharged = false;
  for (let l = 0; l < 3; l++) for (let d = 0; d < 3; d++){
    const u = P.board[l][d]; if (!u) continue;
    if (u.kw.includes('ascensao')){ u.atk++; u.hp++; u.max++; fxCell(side,l,d,'+1/+1','heal'); }
    if (u.kw.includes('cura')){
      [0,1,2].forEach(dd => { const a = P.board[l][dd]; if (a && a.hp < a.max){ const h = Math.min(2, a.max - a.hp); a.hp += h; fxCell(side,l,dd,'+' + h,'heal'); } });
    }
  }
  for (let l = 0; l < 3; l++) for (let d = 0; d < 3; d++){
    const u = P.board[l][d];
    if (u && u.poison){ u.hp -= 1; fxCell(side,l,d,'-1 🧪','dmg'); if (u.hp <= 0) killUnit(side,l,d,u); }
  }
  draw(side);
}
function startRound(){
  S.turnNo++; S.turn = 'p'; S.sel = null; S.msg = '';
  tickSide('p'); tickSide('e');
  if (checkOver()){ render(); return; }
  aiPlan();
  S.busy = false;
  const extra = S.msg ? S.msg + ' ' : '';
  S.msg = `${extra}Rodada ${S.turnNo}: faça suas jogadas e toque em Batalha. O rival está jogando em segredo.`;
  render();
}

function mkUnit(cid, ghost){
  const c = CARDS[cid];
  return {uid:++UID, cid, atk:c.atk, hp:c.hp, max:c.hp, shield:c.kw.includes('escudo'), kw:c.kw, entered:S.turnNo, poison:false, noReturn:!!ghost};
}
function killUnit(side,l,d,u){
  S[side].board[l][d] = null;
  if (u.kw.includes('ilusao') && !u.noReturn && S[side].hand.length < HAND_MAX){
    S[side].hand.push({hid:++UID, cid:u.cid, ghost:true});
    fxCell(side,l,d,'🫧 volta','sh');
  }
}
function place(side, cid, l, d, ghost){
  const c = CARDS[cid];

  u.pending = !!(c.on || u.kw.includes('investida'));
  S[side].board[l][d] = u;
  S.msg = `${who(side)} invocou ${c.name}.`;
}
function arrive(side, l, d, u){
  const c = CARDS[u.cid];
  u.pending = false;
  if (c.on === 'twin'){
    let spot = null;
    [0,1,2].forEach(dd => { if (!spot && !S[side].board[l][dd]) spot = [l,dd]; });
    if (!spot) for (let a = 0; a < 3 && !spot; a++) for (let b = 0; b < 3 && !spot; b++) if (!S[side].board[a][b]) spot = [a,b];
    if (spot){ S[side].board[spot[0]][spot[1]] = mkUnit('eco', true); fxCell(side,spot[0],spot[1],'Eco!','heal'); }
  }
  if (c.on === 'draw') draw(side);
  if (c.on === 'face1') hitHero(opp(side), 1);
  if (c.on === 'heal2'){ S[side].hp = Math.min(HERO_HP, S[side].hp + 2); fxHero(side, '+2', 'heal'); }
  if (c.on === 'volley'){
    const o = opp(side), foes = [];
    for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) if (S[o].board[a][b]) foes.push([a,b]);
    if (foes.length){ const [a,b] = foes[Math.floor(Math.random() * foes.length)]; damageUnit(o, a, b, 2); }
  }
  if (u.kw.includes('investida')) attack(side, l, d, u);
  S.msg = `${CARDS[u.cid].name} (${who(side) === 'Você' ? 'seu' : 'do rival'}): efeito de chegada.`;
}
function damageUnit(side,l,d,amt,src){
  const u = S[side].board[l][d];
  if (!u) return {dealt:0, overflow:0};
  if (u.shield){ u.shield = false; fxCell(side,l,d,'🛡️','sh'); return {dealt:0, overflow:0}; }
  if (u.kw.includes('carapaca')){ amt = Math.max(0, amt - 1); if (!amt){ fxCell(side,l,d,'🐚 0','sh'); return {dealt:0, overflow:0}; } }
  const before = u.hp; u.hp -= amt;
  let t = '-' + amt;
  if (u.hp <= 0) killUnit(side,l,d,u);
  else {

function castSpell(side, cid, tg){
  const c = CARDS[cid], o = opp(side), u = S[tg.side].board[tg.l][tg.d];
  if (c.sp === 'dmg') damageUnit(tg.side, tg.l, tg.d, c.v);
  if (c.sp === 'buff'){ u.atk += c.a; u.hp += c.h; u.max += c.h; fxCell(tg.side, tg.l, tg.d, `+${c.a}/+${c.h}`, 'heal'); }
  if (c.sp === 'shield'){ u.shield = true; fxCell(tg.side, tg.l, tg.d, '🛡️', 'sh'); }
  if (c.sp === 'poison'){ u.poison = true; fxCell(tg.side, tg.l, tg.d, '🧪', 'dmg'); }
  if (c.sp === 'lane') [0,1,2].forEach(d => { if (S[o].board[tg.l][d]) damageUnit(o, tg.l, d, c.v); });
  if (c.sp === 'face') hitHero(o, c.v);
  if (c.sp === 'heal'){ S[side].hp = Math.min(HERO_HP, S[side].hp + c.v); fxHero(side, '+' + c.v, 'heal'); }
  if (c.sp === 'draw') for (let i = 0; i < c.v; i++) draw(side);
  S.msg = `${who(side)} usou ${c.name}.`;
}
const needsUnit = c => ['dmg','buff','shield','poison'].includes(c.sp);

function effAtkU(side,l,u){
  let a = u.atk;
  [0,1,2].forEach(dd => { const x = S[side].board[l][dd]; if (x && x !== u && x.kw.includes('lideranca')) a++; });
  return a;
}
function effAtk(side,l,d){ const u = S[side].board[l][d]; return u ? effAtkU(side,l,u) : 0; }
function attack(side, l, d, uArg){
  const u = uArg || S[side].board[l][d]; if (!u) return;
  const atk = effAtkU(side,l,u); if (atk <= 0) return;
  const o = opp(side);
  const occ = [0,1,2].filter(dd => S[o].board[l][dd]);
  let dealt = 0;
  if (!occ.length){ hitHero(o, atk); dealt = atk; }
  else {
    const idx = u.kw.includes('distancia') ? occ.length - 1 : 0;
    const refl = S[o].board[l][occ[idx]].kw.includes('reflexo');
    const r = damageUnit(o, l, occ[idx], atk, u); dealt = r.dealt;
    if (refl && S[side].board[l][d] === u) damageUnit(side, l, d, 1);
    if (u.kw.includes('perfurar') && r.overflow > 0){
      const nd = occ[idx + 1];
      if (nd !== undefined && S[o].board[l][nd]) dealt += damageUnit(o, l, nd, r.overflow, u).dealt;
      else { hitHero(o, r.overflow); dealt += r.overflow; }
    }
  }
  if (u.kw.includes('vampirico') && dealt > 0 && u){ S[side].hp = Math.min(HERO_HP, S[side].hp + dealt); fxHero(side, '+' + dealt, 'heal'); }
}
function battleOrder(side){
  const list = [];

async function battle(){

  }
  S.pQueue = []; S.aiQueue = [];
  // 3) efeitos de chegada (investida, duplicar, etc.)
  for (const side of ['p','e']){
    for (const {l, d, u} of battleOrder(side)){
      if (!u.pending || S[side].board[l][d] !== u) continue;
      arrive(side, l, d, u); render(); await sleep(550);
      if (checkOver()){ render(); return; }
    }
  }
  // 4) enfrentamento fileira por fileira: na mesma fileira, a n-ésima criatura de cada lado ataca junto
  S.msg = 'Batalha!'; render(); await sleep(450);
  for (let row = 0; row < 3; row++){
  const P = battleOrder('p').filter(x => x.l === row), E = battleOrder('e').filter(x => x.l === row);
  for (let i = 0; i < Math.max(P.length, E.length); i++){
    const pe = P[i] && findUnit('p', P[i].u) ? {...findUnit('p', P[i].u), u:P[i].u} : null;
    const ee = E[i] && findUnit('e', E[i].u) ? {...findUnit('e', E[i].u), u:E[i].u} : null;
    if (!pe && !ee) continue;
    S.active = []; if (pe) S.active.push({side:'p', l:pe.l, d:pe.d}); if (ee) S.active.push({side:'e', l:ee.l, d:ee.d});
    render(); await sleep(320);
    if (pe) attack('p', pe.l, pe.d, pe.u);
    if (ee) attack('e', ee.l, ee.d, ee.u);
    S.active = null; render(); await sleep(480);
    if (checkOver()){ render(); return; }
  }
  }
  startRound();
}

/* ---------- IA do rival ---------- */
function aiCell(c, res){
  const E = S.e, P = S.p; let best = null, bs = -1e9;
  for (let l = 0; l < 3; l++){
    const empty = [0,1,2].filter(d => !E.board[l][d] && !res.has(l + ',' + d)); if (!empty.length) continue;
    const pu = [0,1,2].map(d => P.board[l][d]).filter(Boolean);
    const ou = [0,1,2].filter(d => E.board[l][d] || res.has(l + ',' + d));
    const threat = pu.reduce((s,u) => s + u.atk, 0);
    let s;
    if (pu.length && !ou.length) s = 10 + threat;
    else if (!pu.length) s = 6 + c.atk - ou.length * 2;
    else s = 3 + threat - ou.length * 2;
    s += Math.random();
    if (s > bs){ bs = s; const tank = c.hp > c.atk || c.kw.includes('escudo'); best = {l, d: tank ? empty[0] : empty[empty.length - 1]}; }
  }
  return best;
}
function aiSpell(c){
  const E = S.e, P = S.p; let best = null, bs = -1e9;
  const each = (side, fn) => { for (let l = 0; l < 3; l++) for (let d = 0; d < 3; d++){ const u = S[side].board[l][d]; if (u && u.entered !== S.turnNo) fn(u, l, d); } };
  if (c.sp === 'dmg') each('p', (u,l,d) => { const s = ((!u.shield && u.hp <= c.v) ? 10 : 0) + u.atk - (u.shield ? 3 : 0); if (s > bs){ bs = s; best = {side:'p', l, d}; } });
  if (c.sp === 'poison') each('p', (u,l,d) => { if (!u.poison && u.hp > bs){ bs = u.hp; best = {side:'p', l, d}; } });
  if (c.sp === 'buff') each('e', (u,l,d) => { if (u.atk > bs){ bs = u.atk; best = {side:'e', l, d}; } });
  if (c.sp === 'shield') each('e', (u,l,d) => { if (!u.shield && u.atk + u.hp > bs){ bs = u.atk + u.hp; best = {side:'e', l, d}; } });
  if (c.sp === 'lane'){
    for (let l = 0; l < 3; l++){
      let s = 0;
      [0,1,2].forEach(d => { const u = P.board[l][d]; if (u && !u.shield) s += Math.min(c.v, u.hp) + (u.hp <= c.v ? 3 : 0); });
      if (s >= 3 && s > bs){ bs = s; best = {side:'p', l, d:0}; }
    }
  }
  if (c.sp === 'face') best = {side:'p', l:0, d:0};
  if (c.sp === 'heal' && E.hp <= HERO_HP - c.v) best = {side:'e', l:0, d:0};
  if (c.sp === 'draw' && E.hand.length <= 4) best = {side:'e', l:0, d:0};
  return best;
}
function aiPick(res){
  const E = S.e;
  const opts = E.hand.map((h,i) => ({i, c:CARDS[h.cid]})).filter(o => costOf('e', o.c) <= E.mana).sort((a,b) => b.c.cost - a.c.cost);
  for (const o of opts){
    if (o.c.type === 'unit'){ const cell = aiCell(o.c, res); if (cell) return {t:'play', i:o.i, l:cell.l, d:cell.d}; }
    else { const tg = aiSpell(o.c); if (tg) return {t:'play', i:o.i, tg}; }
  }
  if (!E.recharged && E.hand.length >= 2){
    const want = E.hand.findIndex(h => costOf('e', CARDS[h.cid]) === E.mana + 1);
    if (want >= 0){
      let burn = -1, bc = 99;
      E.hand.forEach((h,i) => { if (i !== want && CARDS[h.cid].cost < bc){ bc = CARDS[h.cid].cost; burn = i; } });
      if (burn >= 0) return {t:'recharge', i:burn};
    }
  }
  return null;
}
function aiPlan(){
  const E = S.e, res = new Set();
  S.aiQueue = [];
  for (let g = 0; g < 12; g++){
    const act = aiPick(res); if (!act) break;
    if (act.t === 'recharge'){ E.hand.splice(act.i, 1); E.mana++; E.recharged = true; continue; }
    const h = E.hand[act.i], c = CARDS[h.cid];
    E.mana -= costOf('e', c); E.hand.splice(act.i, 1);
    if (c.type === 'unit'){ res.add(act.l + ',' + act.d); S.aiQueue.push({t:'unit', cid:h.cid, l:act.l, d:act.d, ghost:h.ghost}); }
    else S.aiQueue.push({t:'spell', cid:h.cid, tg:act.tg});
  }
}

/* ---------- jogador ---------- */
function isValid(side,l,d){
  if (!S || S.sel === null || S.turn !== 'p' || S.busy) return false;
  const c = CARDS[S.p.hand[S.sel].cid];
  if (costOf('p', c) > S.p.mana) return false;
  const u = S[side].board[l][d];
  if (c.type === 'unit') return side === 'p' && !u;
  if (c.sp === 'dmg' || c.sp === 'poison') return side === 'e' && u && u.entered !== S.turnNo;
  if (c.sp === 'buff' || c.sp === 'shield') return side === 'p' && u && u.entered !== S.turnNo;
  if (c.sp === 'lane' || c.sp === 'face') return side === 'e';
  if (c.sp === 'heal' || c.sp === 'draw') return side === 'p';
  return false;
}
function hintFor(c){
  if (c.type === 'unit') return 'Toque numa casa vazia do seu lado.';
  if (c.sp === 'dmg' || c.sp === 'poison') return 'Toque numa criatura inimiga que já estava em campo.';
  if (c.sp === 'buff' || c.sp === 'shield') return 'Toque numa criatura sua que já estava em campo antes desta rodada.';
  if (c.sp === 'lane') return 'Toque em qualquer casa da linha inimiga.';
  if (c.sp === 'face') return 'Toque em qualquer casa do lado inimigo.';
  return 'Toque em qualquer casa do seu lado.';
}

let rotPref = true;
try { rotPref = localStorage.getItem('rotPref') !== 'off'; } catch(e){}
function applyOrient(){
  const app = document.getElementById('app');
  const W = window.innerWidth, H = window.innerHeight;
  const rot = rotPref && H > W;
  document.body.classList.toggle('rot', rot);
  document.body.classList.toggle('land', rot || H <= 520);
  if (rot){ app.style.width = H + 'px'; app.style.height = W + 'px'; }
  else { app.style.width = ''; app.style.height = ''; }
}
window.addEventListener('resize', applyOrient);
window.addEventListener('orientationchange', () => setTimeout(applyOrient, 150));
async function tryLandscape(){
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen();
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
  } catch(e){}
  setTimeout(applyOrient, 200);
}

document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'rot'){ rotPref = !rotPref; try { localStorage.setItem('rotPref', rotPref ? 'on' : 'off'); } catch(e){} applyOrient(); return; }
  if (a === 'gal'){ GAL = t.dataset.r; GALSEL = null; render(); return; }
  if (a === 'gcard'){ GALSEL = t.dataset.k; const sc = document.querySelector('.ov.gal'); const top = sc ? sc.scrollTop : 0; render(); const sc2 = document.querySelector('.ov.gal'); if (sc2) sc2.scrollTop = top; return; }
  if (a === 'galback'){ GAL = null; render(); return; }
  if (a === 'pick'){ tryLandscape(); newGame(t.dataset.r); return; }
  if (a === 'again'){ newGame(S.p.sign); return; }
  if (a === 'menu'){ S = null; render(); return; }
  if (!S || S.over || S.busy || S.turn !== 'p') return;
  const P = S.p;
  if (a === 'hand'){
    const i = +t.dataset.i;
    S.sel = S.sel === i ? null : i;
    if (S.sel !== null){
      const c = CARDS[P.hand[i].cid];
      S.msg = costOf('p', c) > P.mana ? `${c.name}: mana insuficiente. Você pode queimá-la por +1 de mana.` : `${c.name}: ${cardText(c)} ${hintFor(c)}`;
    } else S.msg = 'Sua vez. Toque numa carta da mão.';
    render(); return;
  }
  if (a === 'cell'){
    const side = t.dataset.side, l = +t.dataset.l, d = +t.dataset.d;
    const u = S[side].board[l][d];
    if (S.sel === null){
      if (u){ const c = CARDS[u.cid]; S.msg = `${c.name} (${effAtk(side,l,d)}/${u.hp}). ${cardText(c)}`; render(); }
      return;
    }
    const h = P.hand[S.sel], c = CARDS[h.cid];
    if (costOf('p', c) > P.mana){ S.msg = `Mana insuficiente para ${c.name}.`; render(); return; }
    if (!isValid(side,l,d)){ S.msg = hintFor(c); render(); return; }
    P.mana -= costOf('p', c); P.hand.splice(S.sel, 1); S.sel = null;
    if (c.type === 'unit') place('p', h.cid, l, d, h.ghost);
    else { S.pQueue.push({cid:h.cid, tg:{side, l, d}}); S.msg = `${c.name} preparada. Ela acontece primeiro, quando você tocar em Batalha.`; }
    render(); return;
  }
  if (a === 'recharge'){
    if (S.sel === null || P.recharged) return;
    const c = CARDS[P.hand[S.sel].cid];
    P.hand.splice(S.sel, 1); S.sel = null; P.mana++; P.recharged = true;
    S.msg = `${c.name} queimada: +1 de mana nesta rodada.`;
    render(); return;
  }
  if (a === 'punch'){
    battle();
  }
});

/* ---------- desenho ---------- */
function cellHtml(side,l,d){
  const u = S[side].board[l][d];
  const cls = ['cell'];
  if (d === 0) cls.push('front');
  if (isValid(side,l,d)) cls.push('ok');
  const a = S.active; if (a && a.some(x => x.side === side && x.l === l && x.d === d)) cls.push('atk');
  const pend = (S.pQueue || []).filter(q => q.tg.side === side && q.tg.l === l && (CARDS[q.cid].sp === 'lane' || q.tg.d === d)).map(q => CARDS[q.cid].e).join('');
  let inner = '';
  if (u){
    const c = CARDS[u.cid];
    inner = `<div class="unit ${side === 'e' ? 'foe' : ''}" style="--rc:${RACES[c.race].c}"><span class="emo">${c.e}</span><span class="kws">${u.kw.filter(k => k !== 'escudo').map(k => KW[k].i).join('')}${u.poison ? '🤢' : ''}</span>${u.shield ? '<span class="shd">🛡️</span>' : ''}<b class="a"${effAtk(side,l,d) > u.atk ? ' style="background:#c98a12"' : ''}>${effAtk(side,l,d)}</b><b class="h">${u.hp}</b></div>`;
  }
  if (u && u.pending) inner = inner.replace('<span class="emo">', '<span class="pnd">⏳</span><span class="emo">');
  return `<div class="${cls.join(' ')}" id="c-${side}-${l}-${d}" data-act="cell" data-side="${side}" data-l="${l}" data-d="${d}">${inner}${pend ? `<span class="spell-mark">${pend}</span>` : ''}</div>`;
}
function boardHtml(){
  let h = '<div class="board">';
  for (let l = 0; l < 3; l++){
    h += '<div class="lane">';
    [2,1,0].forEach(d => h += cellHtml('p',l,d));
    h += '<div class="divider"></div>';
    [0,1,2].forEach(d => h += cellHtml('e',l,d));
    h += '</div>';
  }
  return h + '</div>';
}
function heroes(){
  const E = S.e, P = S.p;
  return `<div class="hero heroes"><div class="side"><button class="rotbtn" data-act="rot" aria-label="Alternar modo deitado">⟳</button><span class="av" style="color:${RACES[P.sign].c}">${RACES[P.sign].g}</span><div><div class="nm">Você</div><div class="sub">Deck ${P.deck.length}</div></div><span class="hp" id="hero-p">❤ ${Math.max(0,P.hp)}</span></div><div class="side"><span class="hp" id="hero-e">❤ ${Math.max(0,E.hp)}</span><span class="mana">💧 ${E.max}</span><div style="text-align:right"><div class="nm">Rival de ${RACES[E.sign].n}</div><div class="sub">Mão ${E.hand.length}, deck ${E.deck.length}</div></div><span class="av" style="color:${RACES[E.sign].c}">${RACES[E.sign].g}</span></div></div>`;
}
function pbar(){
  const P = S.p, n = Math.max(P.max, P.mana);
  let orbs = '';
  for (let i = 0; i < n; i++) orbs += `<span class="orb ${i < P.mana ? (i >= P.max ? 'bonus' : 'on') : 'spent'}"></span>`;
  const my = S.turn === 'p' && !S.busy && !S.over;
  return `<div class="hero me"><div class="stats"><span class="orbs">${orbs}</span><span class="mtxt">${P.mana}/${P.max}</span></div><div class="acts"><button class="btn rc" data-act="recharge" ${my && S.sel !== null && !P.recharged ? '' : 'disabled'}>Queimar +1💧</button><button class="btn go" data-act="punch" ${my ? '' : 'disabled'}>Batalha!</button></div></div>`;
}
function cardHtml(c, cost, attrs, cls){
  const body = c.type === 'unit'
    ? `<span class="ck">${c.kw.map(k => KW[k].i).join('')}${c.on ? '⭐' : ''}</span><span class="st"><span class="x">⚔${c.atk}</span><span class="y">❤${c.hp}</span></span>`
    : `<span class="sp">${c.text}</span>`;
  return `<div class="card ${cls || ''}" style="--rc:${RACES[c.race].c};--rr:${RARITY[c.r || 'c'].col}" ${attrs || ''}><span class="cost">${cost}</span><span class="sg">${RACES[c.race].g}</span><span class="emo">${c.e}</span><span class="cn">${c.name}</span>${body}</div>`;
}
function handHtml(){
  const P = S.p;
  if (!P.hand.length) return '<div class="hand"><div class="empty">Sem cartas na mão.</div></div>';
  return '<div class="hand">' + P.hand.map((h,i) => {
    const c = CARDS[h.cid], cost = costOf('p', c);
    const cls = []; if (S.sel === i) cls.push('sel'); if (cost > P.mana) cls.push('poor');
    return cardHtml(c, cost, `data-act="hand" data-i="${i}" tabindex="0"`, cls.join(' '));
  }).join('') + '</div>';
}
let GAL = null, GALSEL = null;
function galleryScreen(){
  const r = RACES[GAL];
  const tabs = ORDER.map(k => `<button class="gtab ${k === GAL ? 'on' : ''}" data-act="gal" data-r="${k}" style="--rc:${RACES[k].c}" aria-label="${RACES[k].n}">${RACES[k].g}</button>`).join('');
  const list = Object.keys(CARDS).filter(k => k !== 'eco' && CARDS[k].race === GAL).sort((a,b) => CARDS[a].cost - CARDS[b].cost || (CARDS[a].type > CARDS[b].type ? 1 : -1));
  const cards = list.map(k => cardHtml(CARDS[k], CARDS[k].cost, `data-act="gcard" data-k="${k}" tabindex="0"`, GALSEL === k ? 'sel' : '')).join('');
  const sel = GALSEL ? CARDS[GALSEL] : null;
  const info = sel ? `<b>${sel.name}</b> (${RARITY[sel.r].n}${sel.type === 'unit' ? `, ${sel.atk}/${sel.hp}` : ', magia'}): ${cardText(sel)}` : 'Toque numa carta para ler o que ela faz.';
  return `<div class="ov gal"><div class="panel wide">
    <div class="gtop"><h2 style="color:${r.c}">${r.g} ${r.n}</h2><button class="btn rc" data-act="galback">Voltar</button></div>
    <div class="gtabs">${tabs}</div>
    <p class="ginfo">${info}</p>
    <div class="ggrid">${cards}</div>
  </div></div>`;
}
function startScreen(){
  const cur = currentSign();
  const signs = ORDER.map(k => { const r = RACES[k]; return `<button class="sign" data-act="pick" data-r="${k}" style="--rc:${r.c}">${k === cur ? '<span class="tag">Temporada</span>' : ''}<span class="g">${r.g}</span><span class="sn">${r.n}</span><span class="sm">${r.el}, ${r.m}</span></button>`; }).join('');
  const legend = Object.values(KW).map(k => `<span>${k.i}</span><span>${k.n}: ${k.d}</span>`).join('') + '<span>⭐</span><span>Efeito ao entrar em campo.</span>';
  return `<div class="ov"><div class="panel wide">
    <h1>Arena dos Pactos</h1>
    <p>Escolha o seu signo. Cada mundo tem seu próprio deck de 30 cartas. O rival vem de um signo aleatório.</p>
    <div class="signs">${signs}</div>
    <button class="btn rc" data-act="gal" data-r="${cur}" style="width:100%;margin-bottom:6px">Ver as 360 cartas</button>
    <details><summary>Como jogar</summary>
    <ul>
      <li>Seu lado é o esquerdo. Invoque criaturas na sua grade 3x3 gastando mana. A coluna mais clara, perto do centro, é a da frente.</li>
      <li>Você e o rival jogam ao mesmo tempo, cada um sem ver o que o outro está fazendo.</li>
      <li>Toque em Batalha: as criaturas do rival são reveladas, depois as magias de fortalecer, depois as magias de dano, depois os efeitos de chegada (⏳).</li>
      <li>Então a arena se enfrenta fileira por fileira, de cima para baixo. Na mesma fileira, a 1ª criatura de cada lado bate junto com a 1ª do outro, a 2ª com a 2ª, não importa a casa. A próxima fileira só começa quando todos os ataques da anterior terminam.</li>
      <li>Cada criatura bate na primeira carta inimiga da sua linha. Linha vazia, o dano vai direto no herói.</li>
      <li>A mana sobe +1 por rodada, até 9. Uma vez por rodada, selecione uma carta e queime-a para ganhar +1 de mana.</li>
      <li>Zere os 30 de vida do rival. O botão ⟳ no topo liga ou desliga o modo deitado.</li>
    </ul>
    <div class="legend">${legend}</div>
    </details>
  </div></div>`;
}
function endScreen(){
  const t = S.result === 'win' ? 'Vitória!' : S.result === 'draw' ? 'Empate' : 'Derrota';
  const p = S.result === 'win' ? `${RACES[S.p.sign].n} venceu ${RACES[S.e.sign].n}.` : S.result === 'draw' ? 'Os dois heróis caíram juntos.' : `${RACES[S.e.sign].n} venceu desta vez.`;
  return `<div class="ov"><div class="panel"><h2>${t}</h2><p>${p}</p><p>Rodadas jogadas: ${Math.ceil(S.turnNo / 2)}</p><div class="acts2"><button class="btn go" data-act="again">Revanche</button><button class="btn rc" data-act="menu">Trocar signo</button></div></div></div>`;
}
function render(){
  const app = $('#app');
  if (!S){ app.innerHTML = GAL ? galleryScreen() : startScreen(); return; }
  const hs = app.querySelector('.hand'); const sl = hs ? hs.scrollLeft : 0;
  app.innerHTML = heroes() + `<div class="table">${boardHtml()}<div class="mid" aria-live="polite">${S.msg}</div></div>` + `<div class="bottom">${pbar()}${handHtml()}</div>` + (S.screen === 'end' ? endScreen() : '');
  const h2 = app.querySelector('.hand'); if (h2) h2.scrollLeft = sl;
  flushFx();
}
applyOrient();
render();
</script>
